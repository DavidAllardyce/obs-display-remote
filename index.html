<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Church OBS Remote</title>
    
    <!-- PWA / Home Screen App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OBS Remote">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1f2937">
    
    <!-- App Icons (Generated as inline SVGs) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='14' x='2' y='3' rx='2'/%3E%3Cpath d='M8 21h8m-4-4v4m-2-11 5 3-5 3z'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231f2937' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' x='0' y='0' fill='%231f2937' stroke='none'/%3E%3Crect width='20' height='14' x='2' y='3' rx='2'/%3E%3Cpath d='M8 21h8m-4-4v4m-2-11 5 3-5 3z'/%3E%3C/svg%3E">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OBS WebSocket JS Library (v5) -->
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js"></script>
    <style>
        /* Prevents double-tap zooming on mobile for faster tapping */
        button { touch-action: manipulation; }
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor-play"><path d="m10 7 5 3-5 3Z"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
            Church Display
        </h1>
        <div id="statusBadge" class="px-3 py-1 rounded-full text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/50 transition-colors">
            Disconnected
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 max-w-3xl mx-auto w-full">
        
        <!-- Connection Panel -->

        <div id="connectionPanel" class="bg-gray-800 rounded-xl p-6 shadow-lg mb-8 transition-all">
            <h2 class="text-lg font-semibold mb-4 text-gray-300">Connect to OBS</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">OBS IP Address & Port</label>
                    <input type="text" id="obsAddress" value="192.168.1.X:4455" 
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500"
                        placeholder="e.g. 192.168.1.50:4455">
                    <p class="text-xs text-gray-500 mt-1">Default port is 4455</p>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">WebSocket Password</label>
                    <input type="password" id="obsPassword" 
                        class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500"
                        placeholder="Leave blank if no password">
                </div>
                <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                    Connect
                </button>
            </div>
            <p id="errorMsg" class="text-red-400 text-sm mt-4 hidden text-center"></p>
        </div>
        
        <!-- Scene Controls Panel (Hidden until connected) -->
        <div id="controlsPanel" class="hidden">
            
            <!-- Output Controls (Stream / Record / Mute) -->
             <!--
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-8">
                <button id="streamBtn" class="py-3 px-2 rounded-lg font-bold border-2 border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all flex flex-col items-center justify-center gap-1 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4-4-4 4"/></svg>
                    <span>Start Stream</span>
                </button>
                <button id="recordBtn" class="py-3 px-2 rounded-lg font-bold border-2 border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all flex flex-col items-center justify-center gap-1 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Start Record</span>
                </button>
                
                <button id="muteBtn" class="col-span-2 md:col-span-1 py-3 px-2 rounded-lg font-bold border-2 border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all flex flex-col items-center justify-center gap-1 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    <span>Mute Output</span>
                </button>
            </div>
            -->

            <h2 class="text-xl font-bold mb-4 text-center text-gray-300">Active Scenes</h2>
            <div id="sceneContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Scene buttons will be injected here by JS -->
            </div>
            
            <div class="mt-10 border-t border-gray-700 pt-6">
                <h2 class="text-lg font-semibold mb-4 text-center text-gray-300">Display Options</h2>
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-gray-400">Monitor:</label>
                        <select id="monitorSelect" class="bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500 min-w-[150px]">
                            <option value="0">Loading...</option>
                        </select>
                    </div>
                    <button id="projectorBtn" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-lg transition-colors flex items-center gap-2">
                        Launch Fullscreen Projector
                    </button>
                </div>
                <p class="text-xs text-gray-500 text-center mt-3">Select the monitor to display the live output.</p>
                <p id="projectorMsg" class="text-sm text-center mt-2 hidden"></p>
            </div>

            <div class="mt-8 flex justify-center">
                 <button id="disconnectBtn" class="text-gray-400 hover:text-white px-4 py-2 rounded border border-gray-600 hover:bg-gray-700 transition-colors">
                    Disconnect
                </button>
            </div>
        </div>

    </main>

    <script>
        const obs = new OBSWebSocket();
        let manualDisconnect = false;
        
        // UI Elements
        const connectionPanel = document.getElementById('connectionPanel');
        const controlsPanel = document.getElementById('controlsPanel');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const obsAddressInput = document.getElementById('obsAddress');
        const obsPasswordInput = document.getElementById('obsPassword');
        const errorMsg = document.getElementById('errorMsg');
        const statusBadge = document.getElementById('statusBadge');
        const sceneContainer = document.getElementById('sceneContainer');
        
        const projectorBtn = document.getElementById('projectorBtn');
        const monitorSelect = document.getElementById('monitorSelect');
        const projectorMsg = document.getElementById('projectorMsg');

        const streamBtn = document.getElementById('streamBtn');
        const recordBtn = document.getElementById('recordBtn');
        const muteBtn = document.getElementById('muteBtn');

        // Load saved credentials on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedAddress = localStorage.getItem('obsAddress');
            const savedPassword = localStorage.getItem('obsPassword');
            if (savedAddress) obsAddressInput.value = savedAddress;
            if (savedPassword) obsPasswordInput.value = savedPassword;
        });

        // Helper to update status badge
        function setStatus(status) {
            statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold border transition-colors';
            if (status === 'connected') {
                statusBadge.textContent = 'Connected';
                statusBadge.classList.add('bg-green-500/20', 'text-green-400', 'border-green-500/50');
                connectionPanel.classList.add('hidden');
                controlsPanel.classList.remove('hidden');
            } else if (status === 'connecting') {
                statusBadge.textContent = 'Connecting...';
                statusBadge.classList.add('bg-yellow-500/20', 'text-yellow-400', 'border-yellow-500/50');
            } else {
                statusBadge.textContent = 'Disconnected';
                statusBadge.classList.add('bg-red-500/20', 'text-red-400', 'border-red-500/50');
                connectionPanel.classList.remove('hidden');
                controlsPanel.classList.add('hidden');
                sceneContainer.innerHTML = '';
            }
        }

        // Output Status Handlers
        function updateStreamUI(active) {
            if (active) {
                streamBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg><span>Stop Stream</span>';
                streamBtn.className = 'py-3 px-2 rounded-lg font-bold border-2 border-red-500 bg-red-600 text-white pulse-red flex flex-col items-center justify-center gap-1 text-sm';
            } else {
                streamBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4-4-4 4"/></svg><span>Start Stream</span>';
                streamBtn.className = 'py-3 px-2 rounded-lg font-bold border-2 border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all flex flex-col items-center justify-center gap-1 text-sm';
            }
        }

        function updateRecordUI(active) {
            if (active) {
                recordBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg><span>Stop Record</span>';
                recordBtn.className = 'py-3 px-2 rounded-lg font-bold border-2 border-red-500 bg-red-600 text-white pulse-red flex flex-col items-center justify-center gap-1 text-sm';
            } else {
                recordBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>Start Record</span>';
                recordBtn.className = 'py-3 px-2 rounded-lg font-bold border-2 border-gray-600 bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all flex flex-col items-center justify-center gap-1 text-sm';
            }
        }

        // Fetch outputs and scenes
        async function loadInitialState() {
            try {
                const { scenes } = await obs.call('GetSceneList');
                const { currentProgramSceneName } = await obs.call('GetCurrentProgramScene');
                
                sceneContainer.innerHTML = ''; // Clear container
                scenes.reverse().forEach(scene => {
                    const btn = document.createElement('button');
                    const isActive = scene.sceneName === currentProgramSceneName;
                    
                    btn.className = `p-6 rounded-xl text-lg font-bold transition-all border-2 flex items-center justify-center min-h-[100px] shadow-lg
                        ${isActive 
                            ? 'bg-blue-600 border-blue-400 text-white transform scale-[1.02]' 
                            : 'bg-gray-700 border-gray-600 text-gray-200 hover:bg-gray-600 hover:border-gray-500'}`;
                    
                    btn.textContent = scene.sceneName;
                    btn.onclick = () => switchScene(scene.sceneName);
                    sceneContainer.appendChild(btn);
                });

                // Load initial output statuses
                const streamStatus = await obs.call('GetStreamStatus');
                updateStreamUI(streamStatus.outputActive);
                
                const recordStatus = await obs.call('GetRecordStatus');
                updateRecordUI(recordStatus.outputActive);

            } catch (err) {
                console.error("Failed to load initial state", err);
            }
        }

        // Switch the active scene in OBS
        async function switchScene(sceneName) {
            try {
                await obs.call('SetCurrentProgramScene', { sceneName: sceneName });
            } catch (err) {
                console.error("Failed to switch scene", err);
            }
        }

        // Fetch available monitors
        async function loadMonitors() {
            try {
                const { monitors } = await obs.call('GetMonitorList');
                monitorSelect.innerHTML = ''; // Clear options
                
                monitors.forEach(monitor => {
                    const option = document.createElement('option');
                    option.value = monitor.monitorIndex;
                    const displayName = monitor.monitorName || `${monitor.monitorWidth}x${monitor.monitorHeight}`;
                    option.textContent = `Index ${monitor.monitorIndex}: ${displayName}`;
                    monitorSelect.appendChild(option);
                });
            } catch (err) {
                console.error("Failed to load monitors", err);
                monitorSelect.innerHTML = '<option value="0">Monitor 0</option><option value="1">Monitor 1</option>';
            }
        }

        // Connect Button Logic
        function initiateConnection() {
            const address = obsAddressInput.value.trim();
            const password = obsPasswordInput.value;
            
            localStorage.setItem('obsAddress', address);
            localStorage.setItem('obsPassword', password);
            
            errorMsg.classList.add('hidden');
            setStatus('connecting');
            connectBtn.disabled = true;
            manualDisconnect = false;

            const wsAddress = address.startsWith('ws://') ? address : `ws://${address}`;
            
            obs.connect(wsAddress, password, { rpcVersion: 1 }).then(() => {
                setStatus('connected');
                loadInitialState();
                loadMonitors();
                connectBtn.disabled = false;
            }).catch(error => {
                console.error('Connection Error:', error);
                setStatus('disconnected');
                errorMsg.textContent = error.message || "Failed to connect. Check IP, Port, and Password.";
                errorMsg.classList.remove('hidden');
                connectBtn.disabled = false;
            });
        }

        connectBtn.addEventListener('click', initiateConnection);

        // Disconnect Button Logic
        disconnectBtn.addEventListener('click', () => {
            manualDisconnect = true; // Prevents auto-reconnect
            obs.disconnect();
        });

        // Output Button Listeners
        streamBtn.addEventListener('click', async () => {
            try { await obs.call('ToggleStream'); } catch (e) { console.error(e); }
        });
        
        recordBtn.addEventListener('click', async () => {
            try { await obs.call('ToggleRecord'); } catch (e) { console.error(e); }
        });

        muteBtn.addEventListener('click', async () => {
            // Gets all audio inputs and mutes them as a panic button
            try {
                const { inputs } = await obs.call('GetInputList');
                inputs.forEach(async (input) => {
                    await obs.call('SetInputMute', { inputName: input.inputName, inputMuted: true });
                });
                muteBtn.classList.replace('bg-gray-800', 'bg-red-900');
                muteBtn.classList.replace('border-gray-600', 'border-red-500');
                muteBtn.querySelector('span').textContent = 'All Muted!';
                setTimeout(() => {
                    muteBtn.classList.replace('bg-red-900', 'bg-gray-800');
                    muteBtn.classList.replace('border-red-500', 'border-gray-600');
                    muteBtn.querySelector('span').textContent = 'Mute Output';
                }, 2000);
            } catch (e) { console.error(e); }
        });

        // Projector Button Logic
        projectorBtn.addEventListener('click', async () => {
            const monitorIndex = parseInt(monitorSelect.value, 10);
            try {
                await obs.call('OpenVideoMixProjector', {
                    videoMixType: 'OBS_WEBSOCKET_VIDEO_MIX_TYPE_PROGRAM',
                    monitorIndex: monitorIndex
                });
                projectorMsg.textContent = `Projector launched on monitor ${monitorIndex}!`;
                projectorMsg.className = "text-sm text-center mt-2 text-green-400";
                projectorMsg.classList.remove('hidden');
                setTimeout(() => projectorMsg.classList.add('hidden'), 3000);
            } catch (err) {
                console.error("Failed to launch projector", err);
                projectorMsg.textContent = "Error: " + (err.message || "Could not launch projector");
                projectorMsg.className = "text-sm text-center mt-2 text-red-400";
                projectorMsg.classList.remove('hidden');
            }
        });

        // OBS Event Listeners
        obs.on('ConnectionClosed', () => {
            setStatus('disconnected');
            // Auto-Reconnect Logic
            if (!manualDisconnect && localStorage.getItem('obsAddress')) {
                console.log("Connection lost. Attempting to auto-reconnect in 5 seconds...");
                setTimeout(() => {
                    if (statusBadge.textContent === 'Disconnected') {
                        initiateConnection();
                    }
                }, 5000);
            }
        });

        obs.on('CurrentProgramSceneChanged', () => {
            if (statusBadge.textContent === 'Connected') loadInitialState();
        });

        obs.on('SceneListChanged', () => {
            if (statusBadge.textContent === 'Connected') loadInitialState();
        });

        obs.on('StreamStateChanged', (data) => updateStreamUI(data.outputActive));
        obs.on('RecordStateChanged', (data) => updateRecordUI(data.outputActive));

    </script>
</body>
</html>
